services:

  frontend:
    build:
      context: ./frontend
    container_name: deploy-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true


  backend:
    build:
      context: ./backend
    container_name: deploy-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

